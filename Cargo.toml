[package]
name = "gsr_visualiser"
version = "0.1.0"
edition = "2021"
description = "GiantSpaceRobot Traktor visualiser - Rust/nannou port"
license = "MIT"

[dependencies]
nannou = "0.19"
# same wgpu that nannou 0.19 uses, for the few items nannou doesn't re-export
wgpu_upstream = { package = "wgpu", version = "0.17" }
midir = "0.10"
cpal = "0.15"
rustfft = "6"
naga = { version = "0.13", features = ["glsl-in", "wgsl-out", "validate"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
